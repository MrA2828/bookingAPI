# SkyWatch API + its Postgres database.
#   skywatch -> http://localhost:8080

services:
  skywatch:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=skywatch-db;Port=5432;Database=skywatch;Username=skywatch;Password=skywatch_dev_pw
    depends_on:
      skywatch-db:
        condition: service_healthy

  skywatch-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: skywatch
      POSTGRES_PASSWORD: skywatch_dev_pw
      POSTGRES_DB: skywatch
    ports:
      - "5543:5432"
    volumes:
      - skywatch-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 10
      test: ["CMD-SHELL", "pg_isready -U skywatch -d skywatch"]

volumes:
  skywatch-data:
